<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      This file overrides Expo's bundled web template. The web export does naive
      first-match string replacement for the head/body close tags, the title and
      lang placeholders, and injected scripts/CSS, so this comment must never
      contain those tokens. Do not add example markup here.

      maximum-scale=1 / user-scalable=no stop iOS Safari from auto-zooming toward
      a focused sub-16px form field and never zooming back (it leaves the PWA
      stuck scaled up). Paired with the 16px form-field rule in src/global.css.
      viewport-fit=cover keeps the standalone PWA edge-to-edge under the notch.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
